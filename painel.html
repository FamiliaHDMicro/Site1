    <script>
        document.getElementById('form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const dados = {
                template: document.getElementById('template').value,
                foto: document.getElementById('foto').value,
                musica: document.getElementById('musica').value,
                video: document.getElementById('video').value
            };
            
            try {
                // LINK CORRIGIDO E INTEGRADO DIRETO COM O SEU WORKER REAL
                const r = await fetch('https://workers.dev', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });
                
                const res = await r.json();
                
                if (r.ok) {
                    alert('SUCESSO! Copie o final do seu link gerado:\n\n' + res.link);
                } else {
                    alert('Erro na máquina! Verifique o banco.');
                }
            } catch (err) {
                alert('Erro de conexão com o Worker.');
            }
        });
    </script>
